name: Robot Courier Valgrind CI

on: [push]

jobs:
  valgrind_tests:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y valgrind build-essential gdb > /dev/null 2>&1

      - name: Run Valgrind on vulnerable code
        run: |
          echo "=== Запуск Valgrind анализа (с ошибками) ==="
          gcc -g -O0 robot_courier_vulnerable.c -o robot_courier_vulnerable
          # Передаем длинный OTA-пакет, чтобы спровоцировать heap overflow
          valgrind --leak-check=full --track-origins=yes --error-exitcode=1 \
            ./robot_courier_vulnerable "FIRMWARE_UPDATE_v1.2.3_CRITICAL_PATCH_FOR_TMR_SYSTEM" \
            > valgrind_output.txt 2>&1 || true

      - name: Run Valgrind on fixed code
        run: |
          echo "=== Проверка исправленного кода ==="
          gcc -g -O0 robot_courier_fixed.c -o robot_courier_fixed
          # Передаем ту же строку. Исправленный код должен отработать без ошибок.
          valgrind --leak-check=full --track-origins=yes \
            ./robot_courier_fixed "FIRMWARE_UPDATE_v1.2.3_CRITICAL_PATCH_FOR_TMR_SYSTEM" \
            || true
          echo "✅ Исправленный код проходит Valgrind"

      - name: Upload Valgrind logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valgrind-report
          path: valgrind_output.txt
          retention-days: 7