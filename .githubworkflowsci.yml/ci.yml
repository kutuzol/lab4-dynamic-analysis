name: Valgrind Analysis

on: [push] # Запускать при каждом пуше в любую ветку

jobs:
  valgrind_tests:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y valgrind build-essential gdb > /dev/null 2>&1

      - name: Run Valgrind on original code
        run: |
          echo "=== Запуск Valgrind анализа (с ошибками) ==="
          gcc -g -O0 example1.c -o example1
          # Передаем строку, чтобы read не зависал
          printf 'XAAAAAAAAAAA' | valgrind --leak-check=full --error-exitcode=1 ./example1 > valgrind_output.txt 2>&1 || true

      - name: Run Valgrind on fixed code
        run: |
          echo "=== Проверка исправленного кода ==="
          gcc -g -O0 example1_fixed.c -o example1_fixed
          # Передаем строку и игнорируем код возврата программы
          printf 'XAAAAAAAAAAA' | valgrind --leak-check=full ./example1_fixed || true
          echo "✅ Исправленный код проходит Valgrind"

      - name: Upload Valgrind logs
        uses: actions/upload-artifact@v4
        if: always() # Сохраняем логи, даже если что-то упало
        with:
          name: valgrind-report
          path: valgrind_output.txt